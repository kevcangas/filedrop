services:
  postgres:
    image: postgres:16-alpine
    container_name: enlace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-enlace_db}"
      POSTGRES_USER: "${POSTGRES_USER:-enlace}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-enlace_secret}"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - enlace_pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enlace} -d ${POSTGRES_DB:-enlace_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  enlace:
    build: .
    container_name: enlace
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ENLACE_PORT: "${ENLACE_PORT:-41823}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-enlace}:${POSTGRES_PASSWORD:-enlace_secret}@postgres:5432/${POSTGRES_DB:-enlace_db}}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-enlace_db}"
      POSTGRES_USER: "${POSTGRES_USER:-enlace}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-enlace_secret}"
      ENLACE_PASSWORD: "${ENLACE_PASSWORD:-}"
      ENLACE_HOST_IP: "${ENLACE_HOST_IP:-}"
      ENLACE_PUBLIC_URL: "${ENLACE_PUBLIC_URL:-}"
      ENLACE_S3_ENABLED: "${ENLACE_S3_ENABLED:-0}"
      ENLACE_S3_ENDPOINT_URL: "${ENLACE_S3_ENDPOINT_URL:-}"
      ENLACE_S3_PUBLIC_URL: "${ENLACE_S3_PUBLIC_URL:-}"
      ENLACE_S3_REGION: "${ENLACE_S3_REGION:-us-east-1}"
      ENLACE_S3_BUCKET: "${ENLACE_S3_BUCKET:-filedrop-storage}"
      ENLACE_S3_ACCESS_KEY: "${ENLACE_S3_ACCESS_KEY:-}"
      ENLACE_S3_SECRET_KEY: "${ENLACE_S3_SECRET_KEY:-}"
      ENLACE_S3_PREFIX: "${ENLACE_S3_PREFIX:-users/}"
      ENLACE_S3_AUTO_CREATE_BUCKET: "${ENLACE_S3_AUTO_CREATE_BUCKET:-1}"
    ports:
      - "41823:41823"
    volumes:
      - enlace_uploads:/app/uploads
      - enlace_buzon:/app/buzon
    networks:
      - default

volumes:
  enlace_pgdata:
  enlace_uploads:
  enlace_buzon:

networks:
  default:
    driver: bridge
